<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Time Machine · incident replay & fix</title>
<style>
  :root{--bg:#0b1020;--panel:#141b2e;--line:#26304a;--txt:#e6ecff;--dim:#8a97b8;
        --info:#5aa0ff;--warn:#f5b942;--err:#ff5c72;--ok:#3ddc84;--acc:#7b5cff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0}.tag{font-size:11px;color:var(--dim)}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .bar{display:flex;gap:10px;margin-bottom:18px}
  input,button,select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:10px 12px}
  button{cursor:pointer;background:var(--acc);border-color:var(--acc);font-weight:600}
  button.ghost{background:var(--panel);border-color:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .ev{display:flex;gap:12px;align-items:flex-start;opacity:0;transform:translateY(6px);animation:in .35s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .ev+.ev{margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .t{color:var(--dim);width:52px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .info .dot{background:var(--info)}.warn .dot{background:var(--warn)}
  .error .dot{background:var(--err)}.kind{font-size:11px;color:var(--dim);text-transform:uppercase}
  .rc{border-left:3px solid var(--acc);padding-left:12px}
  .conf{display:inline-block;background:#1d2740;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px}
  pre{background:#0c1224;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12.5px}
  .add{color:var(--ok)}.del{color:var(--err)}
  .graph{display:flex;gap:14px;align-items:flex-end;height:120px;margin-top:8px}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;align-items:center}
  .barfill{width:100%;border-radius:4px 4px 0 0;transition:height .6s ease,background .6s}
  .lbl{font-size:10px;color:var(--dim)}
  .row{display:flex;gap:16px;flex-wrap:wrap}.row>.card{flex:1;min-width:280px}
  .hide{display:none}.pill{font-size:11px;padding:2px 8px;border-radius:6px;background:#3a1f52;color:#d9b8ff}
  a{color:var(--info)}
</style>
</head>
<body>
<header>
  <h1>⏱ Time Machine</h1>
  <span class="tag">rewind an incident · find root cause · simulate the fix</span>
</header>
<div class="wrap">
  <div class="bar">
    <input id="inc" placeholder="Incident ID e.g. INC-4471" style="flex:1"/>
    <button onclick="replay()">Rewind ▶</button>
    <button class="ghost" id="pick" onclick="showList()">Samples</button>
  </div>
  <div id="list" class="card hide"><h3>Available incidents</h3><div id="listBody"></div></div>

  <div id="tlCard" class="card hide">
    <h3>Reconstructed timeline · <span id="incTitle"></span></h3>
    <div id="timeline"></div>
  </div>

  <div id="rcCard" class="card hide">
    <h3>Root cause <span class="conf" id="conf"></span></h3>
    <div class="rc">
      <p id="rcSummary" style="font-weight:600;margin:.2em 0"></p>
      <p id="rcDetail" style="color:var(--dim)"></p>
      <span class="pill">offending deploy: <b id="rcDeploy"></b></span>
      <pre id="rcDiff"></pre>
    </div>
    <button onclick="applyFix()">Simulate fix in sandbox 🧪</button>
  </div>

  <div class="row">
    <div id="fixCard" class="card hide">
      <h3>Fix applied to sandbox</h3>
      <pre id="fixCmd"></pre>
      <p>PR opened: <a id="prLink" href="#" target="_blank"></a></p>
      <p id="prTitle" style="color:var(--dim)"></p>
    </div>
    <div id="mCard" class="card hide">
      <h3 id="mLabel">Recovery</h3>
      <div style="display:flex;gap:8px;margin-bottom:6px">
        <button class="ghost" onclick="drawMetrics('before')">Before</button>
        <button onclick="drawMetrics('after')">After fix</button>
      </div>
      <div class="graph" id="graph"></div>
    </div>
  </div>
</div>
<script>
let current=null;
async function showList(){
  const r=await fetch('/api/incidents');const items=await r.json();
  document.getElementById('listBody').innerHTML=items.map(i=>
    `<div style="margin:6px 0"><a href="#" onclick="document.getElementById('inc').value='${i.id}';replay();return false">${i.id}</a> — ${i.title} <span class="pill">${i.severity}</span></div>`).join('');
  document.getElementById('list').classList.remove('hide');
}
async function replay(){
  const id=document.getElementById('inc').value.trim();if(!id)return;
  const r=await fetch('/api/replay?id='+encodeURIComponent(id));
  if(!r.ok){alert('Unknown incident id');return;}
  const inc=await r.json();current=inc;
  document.getElementById('list').classList.add('hide');
  document.getElementById('incTitle').textContent=inc.id+' · '+inc.title;
  const tl=document.getElementById('timeline');tl.innerHTML='';
  inc.timeline.forEach((e,idx)=>{
    const d=document.createElement('div');d.className='ev '+e.signal;
    d.style.animationDelay=(idx*0.25)+'s';
    d.innerHTML=`<span class="t">${e.t}</span><span class="dot"></span>
      <div><span class="kind">${e.kind}</span><br>${e.label}</div>`;
    tl.appendChild(d);
  });
  document.getElementById('tlCard').classList.remove('hide');
  setTimeout(()=>{
    const rc=inc.root_cause;
    document.getElementById('conf').textContent=Math.round(rc.confidence*100)+'% confidence';
    document.getElementById('rcSummary').textContent=rc.summary;
    document.getElementById('rcDetail').textContent=rc.detail;
    document.getElementById('rcDeploy').textContent=rc.offending_deploy;
    document.getElementById('rcDiff').innerHTML=rc.diff.split('\n').map(l=>
      l.startsWith('+')?`<span class="add">${l}</span>`:l.startsWith('-')?`<span class="del">${l}</span>`:l).join('\n');
    document.getElementById('rcCard').classList.remove('hide');
  }, inc.timeline.length*260+200);
  document.getElementById('fixCard').classList.add('hide');
  document.getElementById('mCard').classList.add('hide');
}
async function applyFix(){
  const r=await fetch('/api/fix?id='+encodeURIComponent(current.id));const f=await r.json();
  document.getElementById('fixCmd').textContent=f.applied;
  document.getElementById('prLink').textContent=f.pr_url;document.getElementById('prLink').href=f.pr_url;
  document.getElementById('prTitle').textContent=f.pr_title;
  document.getElementById('fixCard').classList.remove('hide');
  document.getElementById('mLabel').textContent=f.metrics.label;
  document.getElementById('mCard').classList.remove('hide');
  drawMetrics('before');setTimeout(()=>drawMetrics('after'),700);
}
function drawMetrics(which){
  const m=current.metrics;const vals=m[which];const max=Math.max(...m.before,...m.after);
  const g=document.getElementById('graph');
  g.innerHTML=vals.map(v=>{
    const h=Math.max(4,Math.round(v/max*100));
    const col=which==='after'?'var(--ok)':(v/max>0.4?'var(--err)':'var(--info)');
    return `<div class="col"><div class="barfill" style="height:${h}%;background:${col}"></div><span class="lbl">${v}</span></div>`;
  }).join('');
}
</script>
</body>
</html>
