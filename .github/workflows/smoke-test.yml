name: smoke-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (all modules)
        run: |
          python -m py_compile whiteboard-to-app/server.py whiteboard-to-app/azure_iac.py

      - name: Smoke test — Whiteboard → App
        run: |
          cd whiteboard-to-app
          PORT=8012 python3 server.py &
          SRV=$!
          sleep 2
          echo "config:";  curl -sf localhost:8012/api/config
          echo; echo "samples:"; curl -sf localhost:8012/api/samples | head -c 200
          echo; echo "parse:";   curl -sf "localhost:8012/api/parse?sample=microservices" > /tmp/g.json
          echo "generate:";      curl -sf -X POST localhost:8012/api/generate -d @/tmp/g.json | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'kind: Deployment' in d['k8s']; print('k8s ok')"
          echo "deploy:";        curl -sf -X POST localhost:8012/api/deploy   -d @/tmp/g.json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='running'; print('deploy ok')"
          kill $SRV
